<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <!--
      Домен коллектора (VITE_COLLECTOR_URL / VITE_API_URL) должен быть в connect-src,
      иначе запросы туда молча блокируются — см. README, раздел "CSP". CSP нельзя
      поменять из JS в рантайме (метатег не переоткрывает политику задним числом),
      а IP коллектора теперь редактируется прямо в панели докладчика без пересборки
      (см. DevPanel.vue) — поэтому единственный вариант, который это не сломает,
      это разрешить сам http-протокол, а не один конкретный адрес. CSP не понимает
      CIDR/wildcard для IP, а host-wildcard'ом единственный порт не ограничить, так
      что схема — самая узкая гарантированно рабочая политика.
      Это сознательное ослабление ТОЛЬКО connect-src и ТОЛЬКО в cordova/capacitor —
      обычная сборка для браузера так же прибита к localhost:8787, как и раньше.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8787<% if (ctx.mode.cordova || ctx.mode.capacitor) { %> http:<% } %><% if (ctx.dev) { %> ws://localhost:*<% } %>; worker-src 'self' blob:;"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
