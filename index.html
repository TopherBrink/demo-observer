<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <!--
      Домен коллектора (VITE_COLLECTOR_URL / VITE_API_URL) должен быть в connect-src,
      иначе запросы туда молча блокируются — см. README, раздел "CSP".
      CSP не понимает CIDR/wildcard для IP, поэтому для реального устройства
      здесь захардожен конкретный IP машины в LAN на день сборки. Сменили
      сеть/машину — поменяйте его тут же (и в .env.cordova).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8787<% if (ctx.mode.cordova || ctx.mode.capacitor) { %> http://192.168.1.114:8787<% } %><% if (ctx.dev) { %> ws://localhost:*<% } %>; worker-src 'self' blob:;"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
